[workspace]
members = ["crates/rfs-core", "crates/rfs-feox"]
# `fuzz` is a cargo-fuzz package (nightly + Linux/macOS, libFuzzer); kept out of
# the default build so `cargo build`/`test` stay stable + cross-platform.
exclude = ["fuzz", "rfs-fuse"]
resolver = "2"

[workspace.package]
authors = ["RFS Contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# Mirror Feox conventions so the two trees feel like one product.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
