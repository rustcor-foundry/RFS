name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine — fmt, clippy, tests, bare-metal RISC-V
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (+ riscv64 no_std target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (pedantic, warnings = errors)
        run: cargo clippy -p rfs-core --all-features -- -D warnings

      - name: Unit tests + crash-recovery simulation
        run: cargo test -p rfs-core

      - name: Bare-metal RISC-V build (no_std)
        run: cargo build -p rfs-core --target riscv64gc-unknown-none-elf

  fuse:
    name: FUSE adapter — build on Linux
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libfuse3 (Debian/SUSE)
        shell: bash
        run: |
          if command -v zypper >/dev/null; then
            sudo zypper --non-interactive install -y fuse3-devel pkgconf-pkg-config gcc
          elif command -v apt-get >/dev/null; then
            sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config gcc
          fi

      - name: Build rfs-fuse (release)
        run: cargo build --release --manifest-path rfs-fuse/Cargo.toml
