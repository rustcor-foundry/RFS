name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # rfs-feox depends on github.com/rustcor-foundry/Feox via a git URL, which
  # is private until the public flip. act_runner gives jobs a pty, so without
  # this git *prompts* for credentials and waits forever -- while cargo holds
  # the package-cache lock for every other build on lx-ws01. With it, git
  # fails immediately and the job fails honestly instead.
  GIT_TERMINAL_PROMPT: "0"

jobs:
  engine:
    name: Engine — fmt, clippy, tests, bare-metal RISC-V
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (+ riscv64 no_std target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (pedantic, warnings = errors)
        run: cargo clippy -p rfs-core -p rfs-feox --all-features -- -D warnings

      - name: Unit tests + crash-recovery simulation
        run: cargo test -p rfs-core -p rfs-feox

      - name: Bare-metal RISC-V build (no_std)
        run: cargo build -p rfs-core -p rfs-feox --target riscv64gc-unknown-none-elf

  fuse:
    name: FUSE adapter — build on Linux
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # rfs-fuse builds fuser with default-features = false, so there is no C
      # libfuse link step — no libfuse3-dev / system packages are required to
      # build. At runtime it execs fusermount3 (from the fuse3 package).
      - name: Build rfs-fuse (release)
        run: cargo build --release --manifest-path rfs-fuse/Cargo.toml
